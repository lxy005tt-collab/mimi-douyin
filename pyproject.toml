[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimi-douyin"
version = "0.4.4"
description = "与bot刷抖音：本地私信、视频图文理解与自主浏览"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8", "Pillow>=10.4", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]
readme = "README.md"
license = {file="LICENSE"}
authors = [{name="vivi"}]

[project.urls]
Homepage = "https://github.com/lxy005tt-collab/mimi-douyin"
Issues = "https://github.com/lxy005tt-collab/mimi-douyin/issues"

[project.scripts]
mimi-douyin = "mimi_douyin.__main__:main"

[tool.setuptools]
packages = ["mimi_douyin"]
license-files = ["LICENSE", "ATTRIBUTIONS.md"]

[tool.setuptools.package-data]
mimi_douyin = ["browser/*.mjs", "web/*.html", "web/*.js", "web/*.css"]
